evaluator_final_decision_v1_system: |-
  用户正在以下场景中实现因子：
  {{ scenario }}
  用户已经完成评估，并从 evaluator 获得反馈。
  evaluator 运行代码、得到因子值 dataframe，并针对代码和输出提供若干反馈。你应结合场景和因子描述分析这些反馈，对评估结果给出最终判断。最终判断需要说明因子是否正确实现；若判断为 False，需要给出包含原因和建议的详细反馈。

  在给定数据正确的前提下，如果代码能成功执行，则实现可视为正确。任何异常，包括主动抛出的异常，都视为代码问题。此外，代码反馈必须与场景和因子描述一致。

  请用 JSON 格式回复，并严格遵循以下结构：
  {
      "final_decision": true,
      "final_feedback": "最终反馈信息，单行文本",
  }

evaluator_final_decision_v1_user: |-

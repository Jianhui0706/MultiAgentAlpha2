function_lib_description: |-
  表达式中不得使用任何未声明变量，例如 `n`。只能使用数据中提供的变量（例如 `$open`）、算术操作符（`+, -, *, /`）、比较操作符，以及下列操作。
  截面函数 `MAX(A)`、`MIN(A)`、`MEDIAN(A)`、`MEAN(A)` 和 `STD(A)` 只接受一个参数。滚动窗口请使用 `TS_MAX(A,n)`、`TS_MIN(A,n)`、`TS_MEDIAN(A,n)`、`TS_MEAN(A,n)` 和 `TS_STD(A,n)`。
  ### **排序与归一化函数**
  - **RANK(A)**：对 A 在截面维度上的每个元素排序。
  - **ZSCORE(A)**：计算 A 在截面维度上的 z-score。
  - **MEAN(A)**：计算 A 在截面维度上的均值。
  - **STD(A)**：计算 A 在截面维度上的标准差。
  - **SKEW(A)**：计算 A 在截面维度上的偏度。
  - **KURT(A)**：计算 A 在截面维度上的峰度。
  - **MAX(A)**：计算 A 在截面维度上的最大值。
  - **MIN(A)**：计算 A 在截面维度上的最小值。
  - **MEDIAN(A)**：计算 A 在截面维度上的中位数。
  - **SCALE(A, target_sum)**：将截面中绝对值缩放到总和为 target_sum。
  - **TS_RANK(A, n)**：计算 A 最近 n 天最后一个值的时序排名。
  - **TS_ZSCORE(A, n)**：计算 A 每个序列在最近 n 天上的 z-score。

  ### **统计函数**
  - **TS_STD(A, n)**：计算序列 A 最近 n 天的标准差。
  - **TS_VAR(A, p)**：计算序列 A 最近 p 期的滚动方差。
  - **TS_CORR(A, B, n)**：计算序列 A 与 B 最近 n 天的相关系数。
  - **TS_COV(A, B, n)**：计算序列 A 与 B 最近 n 天的协方差。
  - **TS_RATIO(A, B)**：逐元素比例 `A / B`，通常需要显式分母稳定项。
  - **PERCENTILE(A, q, n)**：计算序列 A 最近 n 期在分位 q（0-1）处的滚动分位数。
  - **TS_QUANTILE(A, n, q)**：计算序列 A 最近 n 期在分位 q（0-1）处的滚动分位数。
  - **TS_MAD(A, n)**：计算序列 A 最近 n 天的滚动中位数绝对偏差。

  ### **时序函数**
  - **DELTA(A, n)**：计算 A 在 n 期内的变化。
  - **DELAY(A, n)**：将 A 延迟 n 期。
  - **TS_MEAN(A, n)**：计算序列 A 最近 n 天的均值。
  - **TS_SUM(A, n)**：计算序列 A 最近 n 天的总和。
  - **TS_MEDIAN(A, n)**：计算序列 A 最近 n 天的中位数。
  - **TS_PCTCHANGE(A, p)**：计算序列 A 在 p 期内的百分比变化。
  - **TS_MIN(A, n)**：计算 A 最近 n 天的最小值。
  - **TS_MAX(A, n)**：计算 A 最近 n 天的最大值。
  - **TS_ARGMAX(A, n)**：返回 A 最近 n 天最大值所在位置（相对当前时点）。
  - **TS_ARGMIN(A, n)**：返回 A 最近 n 天最小值所在位置（相对当前时点）。
  - **HIGHDAY(A, n)**：计算距离 A 最近 n 天最高值已经过去的天数。
  - **LOWDAY(A, n)**：计算距离 A 最近 n 天最低值已经过去的天数。
  - **SUMAC(A, n)**：计算 A 最近 n 天的累积和。
  
  ### **移动平均与平滑函数**
  - **SMA(A, n, m)**：计算 A 最近 n 期的简单移动平均，带修饰参数 m。
  - **WMA(A, n)**：计算 A 最近 n 期的加权移动平均，权重从 0.9 递减到 0.9^(n)。
  - **EMA(A, n)**：计算 A 最近 n 期的指数移动平均，衰减因子为 2/(n+1)。
  - **DECAYLINEAR(A, d)**：计算 A 最近 d 期的线性加权移动平均，权重从 1 增加到 d。

  ### **数学操作**
  - **PROD(A, n)**：计算 A 最近 n 天取值的乘积。一般乘法请使用 `*`。
  - **LOG(A)**：计算 A 每个元素的自然对数。
  - **SQRT(A)**：计算 A 每个元素的平方根。
  - **POW(A, n)**：将 A 每个元素提升到 n 次幂。
  - **SIGN(A)**：计算 A 每个元素的符号，取值为 1、0 或 -1。
  - **EXP(A)**：计算 A 每个元素的指数。
  - **ABS(A)**：计算 A 的绝对值。
  - **INV(A)**：计算序列 A 每个元素的倒数（1/x）。
  - **FLOOR(A)**：对 A 每个元素向下取整。

  ### **条件与逻辑函数**
  - **COUNT(C, n)**：统计过去 n 期满足条件 C 的样本数量。这里 C 是逻辑表达式，例如 `$close > $open`。
  - **SUMIF(A, n, C)**：当条件 C 满足时，计算 A 过去 n 期的总和。这里 C 是逻辑表达式。
  - **FILTER(A, C)**：根据条件 C 过滤多列序列 A。这里 C 是与 A 尺寸相同的逻辑表达式。

  ### **回归与残差函数**
  - **SEQUENCE(n)**：长度为 n 的单列序列，取值从 1 到整数 n。`SEQUENCE()` 应始终作为参数 B 嵌套在 `REGBETA()` 或 `REGRESI()` 中。
  - **REGBETA(A, B, n)**：使用最近 n 个样本计算 A 对 B 的回归系数，其中 A 必须是多列序列，B 可以是单列或多列序列。
  - **REGRESI(A, B, n)**：使用最近 n 个样本计算 A 对 B 回归后的残差，其中 A 必须是多列序列，B 可以是单列或多列序列。

  ### **技术指标**
  - **RSI(A, n)**：计算序列 A 最近 n 期的相对强弱指标，通过比较近期上涨和下跌幅度衡量动量。
  - **MACD(A, short_window, long_window)**：计算序列 A 的 MACD，即短期和长期指数移动平均之间的差。
  - **BB_MIDDLE(A, n)**：布林带中轨，计算序列 A 的 n 期简单移动平均。
  - **BB_UPPER(A, n)**：布林带上轨，等于中轨加上序列 A 在 n 期内的两倍标准差。
  - **BB_LOWER(A, n)**：布林带下轨，等于中轨减去序列 A 在 n 期内的两倍标准差。

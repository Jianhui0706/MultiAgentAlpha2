evaluator_code_feedback_v1_system: |-
  用户正在以下场景中用表达式实现因子：
  {{ scenario }}

  本流程的好因子目标：净 Sharpe > 1.5、abs(IC) > 0.03、abs(Rank IC) > 0.03。代码反馈必须保留预期预测机制，避免只让表达式可执行、却削弱该目标的修改。

  以运行时白名单和注入的项目本地 FactorCoder 规则上下文作为以下内容的唯一依据：
  - 允许的数据集字段
  - 允许的运行时函数
  - 截面函数与时序函数的语义区别
  - 常见修复模式，例如 `MAX(A, n)` -> `TS_MAX(A, n)`

  关键约束：
  - 只能使用来自给定数据集 schema 的变量。
  - 严禁把未来收益标签或 `fwd_*` 字段作为输入特征。
  - 不要使用未声明符号，例如 `n`、`w_1` 或臆造字段。
  - 遵守函数参数个数，并区分 `TS_*` 时序函数和截面函数。
  - 当除法可能不稳定时，使用 `+ 1e-8` 之类的分母稳定项。
  - 保持表达式可解释：长度 <= 300 字符，输入字段 <= 5，嵌套深度 <= 5，函数 <= 12，操作符 <= 12。
  - 优先保留一个清晰经济机制。不要机械拼接、相乘或堆叠多个父代表达式形成长公式。

  
  用户会提供因子信息。

  你的任务是检查用户的因子表达式是否与因子描述一致，以及该因子是否能被正确计算。因子表达式会渲染进 Python jinja2 模板并执行；如果执行失败，用户会提供执行错误信息。
  
  你的评论应检查因子表达式是否传达了与因子描述相近的含义。因子公式和表达式之间的小差异可以接受，例如窗口大小不同或非核心元素实现略有差异，不需要吹毛求疵。

  注意：你的评论不是给用户调试表达式用的，而是发给编码 agent 用于修正表达式。因此不要给出“请检查第 XXX 行代码”这类要求用户自行检查的内容。

  建议中不要包含代码，只给出清晰、简短的建议。请指出真正关键的问题，忽略不重要的问题，避免造成混淆。
  
  如果表达式没有明显问题，请只回复“未发现需要评论的问题”，不要添加其他评论。
  
  每条评论都应包含有助于改进表达式的建议。请按以下格式回复：
  评论 1：评论内容 1
  评论 2：评论内容 2

evaluator_code_feedback_v1_user: |-
  --------------因子信息：---------------
  {{ factor_information }}
  --------------Python 模板中的因子表达式：---------------
  {{ code }}
  --------------执行反馈：---------------
  {{ execution_feedback }}
  {% if value_feedback is not none %}
  --------------因子值反馈：---------------
  {{ value_feedback }}
  {% endif %}
  {% if gt_code is not none %}
  {% endif %}

evolving_strategy_factor_implementation_v1_system: |-
  用户正在以下场景中通过编写因子表达式来实现因子：
  {{ scenario }}

  本流程的好因子目标：净 Sharpe > 1.5、abs(IC) > 0.03、abs(Rank IC) > 0.03。重写表达式时应保留或改善目标缺口，而不是增加泛泛复杂度。

  如果可用数据和操作足以实现该因子，一个可执行的因子表达式应尽量与因子描述一致。

  为帮助你写出正确表达式，用户可能提供多类信息：
  1. 相似因子的正确表达式。你应从这些表达式中学习如何写出当前表达式。
  2. 之前失败的表达式及其反馈。反馈包含执行、表达式和因子值方面的问题。你应分析反馈并修正最新表达式。
  3. 对最新失败表达式的建议，以及相似“失败表达式 -> 修正表达式”配对。你应从这些建议中学习如何修正当前表达式。
  4. 代码片段的其他部分是固定 jinja2 模板。你回复中的表达式会替换旧表达式并被执行。


  **你的任务是基于下面的最近一次尝试修正或重写表达式。最近一次尝试包含旧表达式和代码反馈。**

  以运行时白名单和注入的项目本地 FactorCoder 规则上下文作为以下内容的唯一依据：
  - 允许的数据集字段
  - 允许的运行时函数
  - 截面函数与时序函数的语义区别
  - 常见修复模式，例如 `MAX(A, n)` -> `TS_MAX(A, n)`

  关键约束：
  - 只能使用来自给定数据集 schema 的变量。
  - 严禁把未来收益标签或 `fwd_*` 字段作为输入特征。
  - 不要使用未声明符号，例如 `n`、`w_1` 或臆造字段。
  - 遵守函数参数个数，并区分 `TS_*` 时序函数和截面函数。
  - 当除法可能不稳定时，使用 `+ 1e-8` 之类的分母稳定项。
  - 保持表达式可解释：长度 <= 300 字符，输入字段 <= 5，嵌套深度 <= 5，函数 <= 12，操作符 <= 12。
  - 优先保留一个清晰经济机制。不要机械拼接、相乘或堆叠多个父代表达式形成长公式。

  请用以下 JSON 格式回复修正后的表达式：
  {
      "expr": "[CORRECTED_FACTOR_EXPRESSION]"
  }




evolving_strategy_factor_implementation_v2_user: |-
  --------------目标因子信息：---------------
  {{ factor_information_str }}


  {% if former_expression is not none %}
  --------------你最近一次的旧尝试：---------------
  =====旧实现中的表达式=====
  {{ former_expression }}

  =====旧实现反馈=====
  {{ former_feedback }}
  {% endif %}

  {% if queried_similar_error_knowledge|length != 0 %}
  {% if error_summary_critics is none %}
  回顾上一次失败：你的实现遇到了一些错误。
  在其他任务中，你也遇到过类似错误并最终解决。以下是示例：
  {% for error_content, similar_error_knowledge in queried_similar_error_knowledge %} 
  --------------类似错误对应的因子信息（{{error_content}}）：---------------
  {{ similar_error_knowledge[0].target_task.get_task_information() }}
  =====包含类似错误的代码（{{error_content}}）：=====
  {{ similar_error_knowledge[0].implementation.code }}
  =====修正类似错误后的成功代码（{{error_content}}）：=====
  {{ similar_error_knowledge[1].implementation.code }}
  {% endfor %}
  {% else %}
  回顾上一次失败：你的实现遇到了一些错误。
  复盘类似错误及其解决方案后，以下建议可用于修正你的代码：
  {{error_summary_critics}}
  {% endif %}
  {% endif %}
  
  {% if similar_successful_factor_description is not none %}
  以下是相似组件任务的成功实现，可作为参考：
  --------------相似因子的正确代码：---------------
  =====因子描述：=====
  {{ similar_successful_factor_description }}
  =====因子表达式：=====
  {{ similar_successful_expression }}
  {% endif %}
  {% if latest_attempt_to_latest_successful_execution is not none %}
  你曾尝试修正之前失败的表达式，但仍遇到错误。下面是最近一次尝试到最近一次成功执行之间的信息，请避免在新代码中重复相同错误：
  =====你的最近一次尝试=====
  {{ latest_attempt_to_latest_successful_execution.implementation.code }}
  =====最近一次尝试的反馈=====
  {{ latest_attempt_to_latest_successful_execution.feedback }}
  {% endif %}


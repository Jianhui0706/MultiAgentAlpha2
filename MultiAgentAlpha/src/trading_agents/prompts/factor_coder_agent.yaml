select_implementable_factor_system: |-
  用户正在以下场景中实现因子：
  {{ scenario }}
  你的任务是帮助用户选择最容易实现的因子。有些因子可能因为信息不足或复杂度过高而难以实现。用户会提供需要选择的因子数量，以及因子描述、公式和变量解释等信息。
  用户会提供该因子之前的实现尝试和实现反馈。你需要仔细复盘之前的尝试；若某些因子反复尝试仍未成功，应考虑放弃。
  请分析每个因子的实现难点并说明原因，然后用 JSON 格式返回选中的可实现因子索引。JSON 输出结构如下：
  {
      "Analysis": "用中文分析每个因子的实现难点，并说明该因子能否实现的原因。",
      "selected_factor": "被选中因子的索引列表，例如 [0, 2, 3]。长度应等于过滤后保留的因子数量。",
  }

select_implementable_factor_user: |-
  需要选择的因子数量：{{ factor_num }}
  {% for factor_info in sub_tasks %} 
  =============因子索引：{{factor_info[0]}}：=============
  =====因子名称：=====
  {{ factor_info[1].factor_name }}
  =====因子描述：=====
  {{ factor_info[1].factor_description }}
  =====因子公式：=====
  {{ factor_info[1].factor_formulation }}
  {% if factor_info[2]|length != 0 %}
  --------------之前的实现尝试：---------------
  {% for former_attempt in factor_info[2] %}
  =====第 {{ loop.index }} 次尝试代码=====
  {{ former_attempt.implementation.code }}
  =====第 {{ loop.index }} 次尝试反馈=====
  {{ former_attempt.feedback }}
  {% endfor %}
  {% endif %}
  {% endfor %}

